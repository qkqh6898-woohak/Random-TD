name: Feedback agent

# 게임 안 [💬 피드백 보내기] → GitHub 이슈(양식 feedback.yml, 라벨 feedback) → Claude 관리형 에이전트(Managed Agents)가
# 고칠 브랜치 fix/feedback-<번호>를 푸시 → 이 워크플로가 PR을 열고 이슈에 댓글 (FB-1b).
# 관리형 에이전트를 쓰는 이유: 계정의 프로모션 크레딧 적용 대상 (Claude Code Action은 대상 아님 → "Credit balance is too low").
# 안전장치:
#   - 저장소 주인이 올린 이슈에, 주인이 라벨을 붙였을 때만 (이슈 글은 누구나 쓸 수 있고 에이전트에게 그대로 들어간다)
#   - 에이전트는 Anthropic 샌드박스에서 실행, GitHub 토큰은 Anthropic git 프록시가 주입 (샌드박스 안에 없음), 네트워크는 패키지 저장소만
#   - main에 직접 푸시하지 않는다 (main 푸시 = 자동 서명 릴리스) — 브랜치 + PR까지만, 합치기는 사람이
#   - 세션 비용 상한 FB_BUDGET_CENTS(정가 기준 3달러), 실행 시간 상한 30분, 같은 이슈는 한 번에 하나
#   - 키는 저장소 Secret ANTHROPIC_API_KEY (앱·저장소 코드에는 없음)
# 다시 돌리기: feedback 라벨을 뗐다가 다시 붙인다.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: feedback-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.label.name == 'feedback' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 에이전트 실행 스크립트만 받는다 (저장소 코드는 관리형 에이전트 샌드박스가 따로 받는다)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/feedback-agent
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Anthropic SDK 설치 (이 단계 폴더에만)
        working-directory: .github/feedback-agent
        run: npm install --no-save --no-package-lock --silent @anthropic-ai/sdk@1.9.0
      - name: 관리형 에이전트로 고치기
        id: agent
        working-directory: .github/feedback-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          FB_BUDGET_CENTS: '300'
          FB_DEADLINE_MIN: '30'
        run: node run.mjs
      - name: PR 열기 + 이슈에 댓글
        if: always() && steps.agent.outputs.session != ''
        working-directory: .github/feedback-agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.agent.outputs.branch }}
          SESSION: ${{ steps.agent.outputs.session }}
          STOP: ${{ steps.agent.outputs.stop }}
          OUTCOME: ${{ steps.agent.outputs.outcome }}
          COST: ${{ steps.agent.outputs.cost }}
        run: |
          summary=$(cat fb-summary.md 2>/dev/null || echo "(요약 없음)")
          footer=$(printf '\n\n---\n세션 `%s` · 종료 `%s` · 결과 `%s` · 비용(정가) %s\n\n_Generated by [Claude Code](https://claude.ai/code)_' "$SESSION" "$STOP" "$OUTCOME" "$COST")
          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            title=$(printf '피드백 #%s 반영' "$ISSUE_NUMBER")
            body=$(printf 'Refs #%s\n\n%s%s' "$ISSUE_NUMBER" "$summary" "$footer")
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json url --jq '.[0].url')
            if [[ -z "$pr" ]]; then
              # 저장소 설정 'Allow GitHub Actions to create and approve pull requests'가 꺼져 있으면 실패한다 → 비교 링크로 대신
              pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body" 2>/dev/null) || pr=""
            fi
            if [[ -n "$pr" ]]; then
              msg=$(printf '🤖 피드백을 반영한 PR을 열었어요: %s' "$pr")
            else
              msg=$(printf '🤖 `%s` 브랜치에 반영했어요. PR 자동 생성이 저장소 설정으로 막혀 있어 아래 링크에서 [Create pull request]를 눌러 주세요:\nhttps://github.com/%s/compare/main...%s?expand=1' "$BRANCH" "$GITHUB_REPOSITORY" "$BRANCH")
              echo "::warning title=PR 자동 생성 막힘::Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'를 켜면 PR을 자동으로 연다"
            fi
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s%s' "$msg" "$summary" "$footer")"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf '🤖 이번 실행에서는 브랜치를 만들지 않았어요 (바꿀 코드가 없거나 반영하지 못함).\n\n%s%s' "$summary" "$footer")"
          fi
