name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-check-build:
    name: 테스트 · 검사 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 액션은 android.yml과 같은 커밋 SHA로 고정 (V2 L9 — 태그가 옮겨져도 같은 코드). python3는 러너 기본(android.yml과 같음)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: 의존성 설치
        run: npm ci

      - name: 단위·통합 테스트 (Vitest)
        run: npm test

      - name: 타입·결정성·데이터 검사
        run: npm run check

      - name: 자바 순수 클래스 검사 (UpdateLogic · FeedbackLinks · AssetPaths, JVM)
        run: bash android/check-java.sh

      - name: 프로덕션 빌드
        run: npm run build

      - name: 번들 크기 기록
        run: du -sh dist && ls -l dist/assets
