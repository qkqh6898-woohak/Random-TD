name: Android APK

# 작업 순서 (A-1b 검토 반영: 서명을 외부 코드에서 떼어 냄):
#   build   — npm·SDK로 웹 검사(test·check·build)와 서명 전 APK. 서명 비밀값을 전혀 참조하지 않는다.
#   sign    — build가 올린 서명 전 APK만 내려받아 apksigner로 서명·확인 (npm을 돌리지 않음). **main에서만** (서명 배포는 main만),
#             Environment 'android-release'(배포 브랜치 = main)의 비밀값이 있을 때만 (ANDROID_KEY_ALIAS는 없으면 'randomtd').
#   publish — 서명된 APK를 Release android-v<버전>에 (main만, 태그가 이미 있으면 건너뜀).
# 버전 (U-1): main 푸시마다 새 APK가 나가도록 build가 tools/release-version.mjs로 고른다 —
#   package.json version이 이미 나온 android-v* 태그보다 크면 그대로, 아니면 가장 높은 태그의 다음 patch (0.1.9 → 0.1.10).
#   versionCode = major×1000000 + minor×1000 + patch. 고른 버전은 CI 작업 폴더의 package.json·package-lock.json·AndroidManifest에만 쓴다 (커밋하지 않음).
#   문서만 바꾼 푸시(docs/**, *.md)는 돌지 않는다 (새 APK 없음). 같은 ref의 실행은 하나씩 (concurrency) → 버전이 겹치지 않는다.
# feat/android 푸시는 build(서명 전 APK)만. 옛 codex/android-apk-v* 갈래는 이제 빌드하지 않는다.
# 비밀값: ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD (README '안드로이드 APK').
# 액션은 커밋 SHA로 고정 (git ls-remote로 확인한 v4 태그의 커밋, 주석 = 태그).
on:
  push:
    branches:
      - main
      - feat/android
    # 문서만 바뀐 푸시는 새 APK를 만들지 않는다 (수동 실행은 그대로)
    # .github/** (워크플로·이슈 양식)만 바뀐 푸시도 새 APK를 만들지 않는다 (FB-1) — 이 파일을 고친 뒤 빌드가 필요하면 수동 실행
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      versionCode: ${{ steps.version.outputs.versionCode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # 버전·릴리스 노트에 android-v* 태그와 그 사이 커밋이 필요하다 (전체 기록 + 태그)
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: 릴리스 버전 정하기 (CI 작업 폴더에만 씀)
        id: plan
        run: |
          [[ "$(git rev-parse --is-shallow-repository)" == "false" ]] || { echo "::error::전체 기록이 아니다 (fetch-depth: 0)"; exit 1; }
          git tag -l 'android-v*' > "$RUNNER_TEMP/rtd-tags.txt"
          echo "기존 태그: $(tr '\n' ' ' < "$RUNNER_TEMP/rtd-tags.txt")"
          # (기본 셸은 pipefail이 없어 파이프 대신 파일로 — 스크립트가 거절하면 이 단계가 실패해야 한다)
          node tools/release-version.mjs --tags-file "$RUNNER_TEMP/rtd-tags.txt" --write > "$RUNNER_TEMP/rtd-plan.txt"
          cat "$RUNNER_TEMP/rtd-plan.txt"
          cat "$RUNNER_TEMP/rtd-plan.txt" >> "$GITHUB_OUTPUT"
          git diff --stat -- package.json package-lock.json android/AndroidManifest.xml

      - name: 릴리스 노트 (이전 android-v 태그 이후 커밋 제목)
        env:
          PREV_TAG: ${{ steps.plan.outputs.previousTag }}
        run: |
          mkdir -p release-notes
          range=HEAD
          if [[ -n "$PREV_TAG" ]] && git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            range="$PREV_TAG..HEAD"
          fi
          # 제목만 (%s) — Co-Authored-By·Claude-Session 꼬리 줄은 본문이라 들어가지 않지만, 혹시 제목에 있으면 뺀다
          git log --no-merges --format='- %s' "$range" | grep -v -i -E '^- (Co-Authored-By|Claude-Session):' > "$RUNNER_TEMP/rtd-log.txt" || true
          total=$(wc -l < "$RUNNER_TEMP/rtd-log.txt")
          {
            echo "Assets의 APK를 내려받아 설치하거나 기존 앱 위에 업데이트하세요 (v0.1.7과 같은 앱 ID·서명). 앱은 오프라인에서 동작합니다."
            echo
            echo "### 바뀐 점"
            if (( total == 0 )); then
              echo "- 자잘한 정리"
            else
              head -n 30 "$RUNNER_TEMP/rtd-log.txt"
              if (( total > 30 )); then echo "- … 외 $((total - 30))개"; fi
            fi
          } > release-notes/notes.md
          cat release-notes/notes.md

      - name: 버전 확인 (package.json = AndroidManifest = 고른 버전)
        id: version
        env:
          PLANNED: ${{ steps.plan.outputs.version }}
          PLANNED_CODE: ${{ steps.plan.outputs.versionCode }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::package.json version이 x.y.z가 아니다: $version"; exit 1; }
          manifest=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml)
          code=$(sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' android/AndroidManifest.xml)
          [[ "$manifest" == "$version" ]] || { echo "::error::AndroidManifest versionName($manifest) ≠ package.json($version)"; exit 1; }
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "::error::AndroidManifest versionCode가 없다"; exit 1; }
          [[ "$version" == "$PLANNED" && "$code" == "$PLANNED_CODE" ]] || { echo "::error::쓴 버전($version/$code)이 고른 버전($PLANNED/$PLANNED_CODE)과 다르다"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code" >> "$GITHUB_OUTPUT"

      - name: 의존성 설치
        run: npm ci
      - name: 단위·통합 테스트
        run: npm test
      - name: 타입·결정성·데이터 검사
        run: npm run check
      - name: 웹 빌드
        run: npm run build
      - name: Java 검사 (AssetPaths · UpdateLogic)
        run: bash android/check-java.sh

      - name: 서명 전 APK 빌드
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          sdk="$RUNNER_TEMP/rtd-android"
          bash android/setup-sdk.sh "$sdk"
          bash android/build-apk.sh "$sdk" "android-build/Random-TD_Offline_v$VERSION-unsigned.apk"
          dump=$("$sdk/build-tools/android-15/aapt2" dump badging "android-build/Random-TD_Offline_v$VERSION-unsigned.apk")
          badging=${dump%%$'\n'*}
          echo "$badging"
          [[ "$badging" == *"name='com.woohak.randomtd'"* ]] || { echo "::error::앱 ID가 com.woohak.randomtd가 아니다"; exit 1; }
          [[ "$badging" == *"versionName='$VERSION'"* ]] || { echo "::error::APK versionName이 $VERSION이 아니다"; exit 1; }
          [[ "$badging" == *"versionCode='$VERSION_CODE'"* ]] || { echo "::error::APK versionCode가 $VERSION_CODE가 아니다"; exit 1; }
          # 앱 안 업데이트(U-1)에 필요한 권한: 인터넷(자바 쪽 HTTPS만 — WebView는 APK 안 파일만 연다) · 업데이트 설치
          perms=$("$sdk/build-tools/android-15/aapt2" dump permissions "android-build/Random-TD_Offline_v$VERSION-unsigned.apk")
          echo "$perms"
          for p in android.permission.INTERNET android.permission.REQUEST_INSTALL_PACKAGES; do
            grep -Fq "name='$p'" <<< "$perms" || { echo "::error::APK 권한 $p가 없다"; exit 1; }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned-v${{ steps.version.outputs.version }}
          path: android-build/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes-v${{ steps.version.outputs.version }}
          path: release-notes/notes.md
          if-no-files-found: error

  sign:
    needs: build
    # 서명 배포는 main에서만 (feat/android는 서명 전 APK만)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      SIGNER_SHA256: 0422434cc6f7026d53e97e8c5aac9a29ff5d5ccf8d2d1228525d8feb2a7cd02a
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # 저장소 코드는 받지 않는다 — SDK 받는 스크립트만 build가 쓴 것과 같은 것을 쓰려고 그 파일 하나만 (sparse)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: android/setup-sdk.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-unsigned-v${{ needs.build.outputs.version }}
          path: android-build

      - name: 서명 (비밀값이 모두 있을 때만)
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          # ANDROID_KEY_ALIAS는 없으면 v0.1.7 키의 별칭 'randomtd'를 쓴다 (나머지 셋은 꼭 필요)
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::notice title=서명 안 함::비밀값이 없어 서명 전 APK만 남깁니다. Environment 'android-release'의 secrets에 추가하세요: ${missing[*]}"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sdk="$RUNNER_TEMP/rtd-android"
          bash android/setup-sdk.sh "$sdk"
          tools="$sdk/build-tools/android-15"
          keydir="$RUNNER_TEMP/rtd-signing"
          mkdir -m 700 -p "$keydir"
          # 키 저장소(PKCS12, v0.1.7의 randomtd.p12)는 작업 폴더가 아닌 RUNNER_TEMP에만 풀고, 값은 출력하지 않는다
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keydir/release.p12"
          unsigned="android-build/Random-TD_Offline_v$VERSION-unsigned.apk"
          mkdir -p android-release
          signed="android-release/Random-TD_Offline_v$VERSION.apk"
          "$tools/apksigner" sign \
            --ks "$keydir/release.p12" \
            --ks-type PKCS12 \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "${ANDROID_KEY_ALIAS:-randomtd}" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$signed" "$unsigned"
          rm -f "$keydir/release.p12"
          echo "서명 완료 — 확인 중"
          if ! "$tools/apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/rtd-cert.txt"; then
            echo "::error title=서명 확인 실패::apksigner verify가 실패했습니다."
            grep -E 'Verified using|ERROR|WARNING|DOES NOT VERIFY' "$RUNNER_TEMP/rtd-cert.txt" || true
            exit 1
          fi
          # 결과 요약 (인증서 지문·서명 방식만 — 공개 정보)
          grep -E 'Verified using|certificate SHA-256 digest' "$RUNNER_TEMP/rtd-cert.txt" || true
          # minSdkVersion 29(≥ 28)이면 apksigner verify는 v3로 전 범위를 확인하고 v2를 false로 보고한다
          # (v2 블록은 들어 있지만 P 이상 기기는 v3만 본다) → v3만 필수로 확인
          if ! grep -Fxq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/rtd-cert.txt"; then
            echo "::error title=v3 서명 없음::APK Signature Scheme v3로 확인되지 않았습니다."
            exit 1
          fi
          if ! grep -Fxq "Signer #1 certificate SHA-256 digest: $SIGNER_SHA256" "$RUNNER_TEMP/rtd-cert.txt"; then
            echo "::error title=서명 키가 다름::서명 인증서 SHA-256이 v0.1.7 키($SIGNER_SHA256)와 다릅니다. 이 APK는 기존 앱 위에 업데이트로 설치되지 않습니다."
            grep 'certificate SHA-256 digest' "$RUNNER_TEMP/rtd-cert.txt" || true
            exit 1
          fi
          (cd android-release && sha256sum -- *.apk > SHA256SUMS)
          cat android-release/SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 키 저장소 지우기
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rtd-signing"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.sign.outputs.signed == 'true'
        with:
          name: android-release-v${{ needs.build.outputs.version }}
          path: android-release/
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: needs.sign.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-v${{ needs.build.outputs.version }}
          path: android-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes-v${{ needs.build.outputs.version }}
          path: release-notes
      - name: GitHub Releases에 APK 게시
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="android-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 버전은 build가 태그를 보고 자동으로 고르므로 보통 일어나지 않는다 (같은 커밋을 수동으로 다시 돌렸을 때 등)
            echo "::notice title=게시 건너뜀::$tag Release가 이미 있습니다."
            exit 0
          fi
          gh release create "$tag" "android-release/Random-TD_Offline_v$VERSION.apk" android-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "운빨 디펜스 Android v$VERSION" \
            --notes-file release-notes/notes.md
